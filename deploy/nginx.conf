# /etc/nginx/sites-available/kawakaze
# Plain HTTP on purpose: `certbot --nginx -d kawakaze.example` adds the HTTPS server block, the certificate
# lines and the HTTP -> HTTPS redirect itself. Replace kawakaze.example and the paths first.
# After certbot, you can add http2: `listen 443 ssl http2;` on nginx < 1.25, `http2 on;` on newer builds.

server {
	listen 80;
	listen [::]:80;
	server_name kawakaze.example;

	# publish: 4 MiB card + 2 x 12 MiB pictures; sync payloads up to 64 MiB
	client_max_body_size 64m;

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;

	location /assets/ {
		alias /opt/kawakaze/web/assets/;
		expires 1h;
		add_header Cache-Control "public";
		add_header X-Content-Type-Options nosniff always;
	}

	location = /favicon.png {
		alias /opt/kawakaze/web/favicon.png;
		expires 7d;
	}

	# content-addressed, never changes
	location /media/ {
		alias /opt/kawakaze/data/media/;
		expires max;
		add_header Cache-Control "public, immutable";
		add_header Access-Control-Allow-Origin "*";
		add_header X-Content-Type-Options nosniff always;
		types { image/webp webp; }
		default_type image/webp;
		try_files $uri =404;
	}

	location / {
		proxy_pass http://127.0.0.1:8787;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 60s;
	}
}
