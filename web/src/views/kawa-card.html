<div class="scenario-card kawa-card lineout">
	<a class="scenario-card-icon-container" data-ref="picture-link">
		<img data-ref="icon" loading="lazy" alt="">
	</a>
	<div class="list grow">
		<div class="row-compact">
			<a class="kawa-card-title" data-ref="title"></a>
			<div class="kawa-score no-shrink" data-ref="score"></div>
		</div>
		<div class="row baseline">
			<div class="row-wrap kawa-authors" data-ref="authors"></div>
			<div class="hint float-end no-shrink" data-ref="meta"></div>
		</div>
		<hr>
		<div class="scenario-card-description kawa-snippet" data-ref="snippet"></div>
		<div class="scenario-card-tags" data-ref="tags"></div>
	</div>
	<div class="kawa-cover" data-ref="cover" hidden>
		<div>Hidden content</div>
		<div class="hint" data-ref="cover-tags"></div>
		<button class="lineout" data-ref="reveal">reveal</button>
	</div>
</div>
