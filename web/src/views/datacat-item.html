<div class="datacat-item lineout">
	<a class="datacat-item-picture" data-ref="picture-link" target="_blank" rel="noopener noreferrer">
		<img data-ref="picture" loading="lazy" alt="" referrerpolicy="no-referrer">
	</a>
	<div class="list grow">
		<div class="row-compact">
			<a class="kawa-card-title" data-ref="title" target="_blank" rel="noopener noreferrer"></a>
			<div class="kawa-score no-shrink" data-ref="stats"></div>
		</div>
		<div class="row baseline">
			<div class="kawa-authors" data-ref="creator"></div>
			<div class="hint float-end no-shrink" data-ref="meta"></div>
		</div>
		<div class="datacat-item-description hint" data-ref="description"></div>
		<div class="scenario-card-tags datacat-item-tags" data-ref="tags"></div>
		<button class="lineout fit float-end" data-ref="import">import</button>
	</div>
	<div class="kawa-cover" data-ref="cover" hidden>
		<div>Hidden content</div>
		<div class="hint" data-ref="cover-tags"></div>
		<button class="lineout" data-ref="reveal">reveal</button>
	</div>
</div>
