<div class="scenario-card lineout">
	<div class="scenario-card-icon-container">
		<img class="pointer" data-ref="icon">
	</div>
	<div class="list grow">
		<h6 class="pointer" data-ref="title"></h6>
		<div class="row-compact">
			<button class="strip ghost pointer float-end" data-ref="download">⤓</button>
			<button class="strip ghost pointer" data-ref="sync" hidden>⇅</button>
			<button class="strip ghost pointer" data-ref="delete">✖</button>
			<button class="strip ghost pointer" data-ref="edit">✎</button>
			<button class="lineout" data-ref="play">play</button>
		</div>
		<div class="row baseline">
			<a data-ref="author-link" hidden></a>
			<span data-ref="author" hidden></span>
			<div class="hint float-end" data-ref="tokens"></div>
		</div>
		<div class="row-compact align-center kawa-library-status hint" data-ref="status" hidden></div>
		<hr>
		<div class="scrollable">
			<div class="scenario-card-tags" data-ref="tags"></div>
			<div class="scenario-card-description md" data-ref="description"></div>
		</div>
	</div>
</div>
